<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <input type="text" id="location-input" placeholder="Enter location">
        <button id="search-button">Search</button>
        <button id="geo-button">Use Geolocation</button>
        <button id="toggle-units">Units: °C</button>
        <button id="add-favorite">Add to Favorites</button>

        <div id="weather-info"></div>
        <div id="forecast-info"></div>
        <div id="hourly-forecast"></div>
        <div id="air-quality-info"></div>
        <div id="favorite-locations"></div>

        <button id="share-button">Share</button>
        <div id="share-modal" style="display:none;">
            <h2>Share Weather Info</h2>
            <div id="social-icons">
                <img id="whatsapp-icon" src="whatsapp.png" alt="WhatsApp">
                <img id="twitter-icon" src="twitter.png" alt="Twitter">
                <img id="facebook-icon" src="facebook.png" alt="Facebook">
                <img id="linkedin-icon" src="linkedin.png" alt="LinkedIn">
            </div>
            <button id="close-modal">Close</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
